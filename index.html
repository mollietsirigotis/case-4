<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Potter</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <header>
        <nav>
            <a href="#" onclick="location.reload();">
                <img src="img/image.png" id="hogwarts-logo" alt="Hogwarts logo">
            </a>
        </nav>
    </header>

    <div id="start-page">

        <h1>
            Harry Potter
        </h1>
        <p>
            Write your Hogwarts house of choice and <br>
            wave the wand to revelio the students
        </p>
        <form id="search-form">
            <div class="input-with-info">
                <input type="text" id="house-search" name="house-search" placeholder="Enter housename here" required
                    autocomplete="off">

                <span class="info-container">
                    <span class="info-icon">i</span>
                    <div class="tooltip">
                        The Hogwarts houses are: Gryffindor, Slytherin,<br>
                        Ravenclaw and Hufflepuff.<br>
                        Choose one of them.
                    </div>
                </span>
            </div>
            <div id="error-message"></div>

            <input type="submit" value="" id="search-button">
        </form>
    </div>

    <h1 id="house-title"></h1>
    <div id="character-feed"></div>

    <footer>
        <p>
            ©️ Mollie Tsirigotis<br>
            Case 4 JavaScript API<br>
            Glimåkra Folkhögskola
        </p>
    </footer>

    <script src="scripts/script.js"></script>
</body>

</html>
